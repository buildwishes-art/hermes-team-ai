<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Team AI — the panel dialog</title>
  <desc>A rendering of the live dialog: mode row, rounds, model filter, the combos and models lists with turn-order badges, and the footer.</desc>

  <rect width="560" height="520" fill="#14111e" opacity="0.6"/>
  <rect x="24" y="16" width="512" height="488" rx="12" fill="#1e1a2c" stroke="#342e49"/>

  <!-- header -->
  <text x="44" y="48" fill="#eceaf3" font-size="14" font-weight="600">Team AI panel</text>
  <text x="44" y="70" fill="#aba4bd" font-size="12">Several models answer the next message together — mim-router models only.</text>
  <text x="508" y="50" fill="#7f7893" font-size="13" text-anchor="middle">✕</text>
  <line x1="24" y1="86" x2="536" y2="86" stroke="#342e49"/>

  <!-- modes -->
  <rect x="44" y="100" width="118" height="28" rx="6" fill="none"/>
  <text x="103" y="119" fill="#aba4bd" font-size="12" text-anchor="middle">Race</text>
  <rect x="166" y="100" width="118" height="28" rx="6" fill="#a78bfa"/>
  <text x="225" y="119" fill="#14111e" font-size="12" text-anchor="middle">Discuss</text>
  <text x="347" y="119" fill="#aba4bd" font-size="12" text-anchor="middle">Plan</text>
  <text x="469" y="119" fill="#aba4bd" font-size="12" text-anchor="middle">Build</text>

  <text x="44" y="152" fill="#aba4bd" font-size="12">Turns. Each reads the others and replies to them by @handle.</text>

  <!-- rounds -->
  <text x="44" y="182" fill="#aba4bd" font-size="12">Rounds</text>
  <rect x="94" y="168" width="64" height="24" rx="6" fill="#29233b" stroke="#7468a0"/>
  <text x="104" y="185" fill="#eceaf3" font-size="12">1</text>
  <text x="170" y="185" fill="#7f7893" font-size="12">one round = every model speaks once (max 8)</text>
  <line x1="24" y1="206" x2="536" y2="206" stroke="#342e49"/>

  <!-- filter -->
  <rect x="44" y="220" width="472" height="28" rx="6" fill="#29233b" stroke="#7468a0"/>
  <text x="56" y="239" fill="#eceaf3" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">oc/</text>
  <line x1="24" y1="264" x2="536" y2="264" stroke="#342e49"/>

  <!-- list -->
  <text x="46" y="288" fill="#aba4bd" font-size="12">Models</text>

  <rect x="38" y="298" width="484" height="28" rx="6" fill="#29233b"/>
  <rect x="46" y="303" width="18" height="18" rx="5" fill="none" stroke="#a78bfa"/>
  <text x="55" y="317" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text>
  <text x="74" y="317" fill="#eceaf3" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">oc/big-pickle</text>

  <rect x="46" y="335" width="18" height="18" rx="5" fill="none" stroke="#7468a0"/>
  <text x="55" y="349" fill="#7f7893" font-size="10" text-anchor="middle">·</text>
  <text x="74" y="349" fill="#eceaf3" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">oc/deepseek-v4-flash-free</text>

  <rect x="46" y="367" width="18" height="18" rx="5" fill="none" stroke="#7468a0"/>
  <text x="55" y="381" fill="#7f7893" font-size="10" text-anchor="middle">·</text>
  <text x="74" y="381" fill="#eceaf3" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">oc/mimo-v2.5-free</text>

  <rect x="38" y="394" width="484" height="28" rx="6" fill="#29233b"/>
  <rect x="46" y="399" width="18" height="18" rx="5" fill="none" stroke="#a78bfa"/>
  <text x="55" y="413" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2</text>
  <text x="74" y="413" fill="#eceaf3" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">oc/hy3-free</text>

  <rect x="46" y="431" width="18" height="18" rx="5" fill="none" stroke="#7468a0"/>
  <text x="55" y="445" fill="#7f7893" font-size="10" text-anchor="middle">·</text>
  <text x="74" y="445" fill="#eceaf3" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">oc/nemotron-3-ultra-free</text>

  <!-- footer -->
  <line x1="24" y1="462" x2="536" y2="462" stroke="#342e49"/>
  <text x="44" y="487" fill="#aba4bd" font-size="12">2 on the panel · 1 round</text>
  <text x="404" y="487" fill="#aba4bd" font-size="12">Turn off</text>
  <rect x="452" y="472" width="68" height="26" rx="6" fill="#a78bfa"/>
  <text x="486" y="489" fill="#14111e" font-size="12" text-anchor="middle">✓ Use panel</text>
</svg>
